<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HTML5</title>
</head>

<body onload="openWindow()">

<h3>HTML5</h3>
<hr>

<p>
HTML5를 학습하는 사이트입니다.
여기서 HTML5, CSS3, 자바스크립트를
배울 수 있습니다.
</p>

<script>
function openWindow() {
    let win = window.open(
        "",
        "",
        "width=200,height=80"
    );

    if (win != null) {
        win.document.write("접속 감사합니다!");
        win.document.close();
    }
}
</script>

</body>
</html>
