<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HTML5</title>
<script>
    function welcome() {
        const win = window.open(
            "",
            "_blank",
            "width=200,height=80,left=500,top=400"
        );

        if (win === null) {
            return;
        }

        win.document.write(
            '<!DOCTYPE html><html lang="ko">' +
            '<head><meta charset="utf-8"></head>' +
            '<body>접속 감사합니다!<br>' +
            '열심히 하세요!</body></html>'
        );

        win.document.close();
        win.document.title = "환영";
        win.document.body.style.backgroundColor = "yellowgreen";
    }
</script>
</head>
<body onload="welcome()">
<h3>HTML5</h3>
<hr>
<p>
    HTML5를 학습하는 사이트입니다.
    여기서 HTML5, CSS3, 자바스크립트를
    배울 수 있습니다.
</p>
</body>
</html>
