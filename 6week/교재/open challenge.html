<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>별 문자 출력하기</title>
    <script>
        function printStar(n) {
            let num = parseInt(n);
            // 정수가 아니거나 양의 정수가 아닌 경우 오류 처리
            if (isNaN(num) || num <= 0 || String(num) !== n.trim()) {
                document.write("입력 오류 입니다.");
                return;
            }
            // 별 출력
            for (let i = 1; i <= num; i++) {
                for (let j = 0; j < i; j++) {
                    document.write("*");
                }
                document.write("<br>");
            }
        }
    </script>
</head>
<body>
    <h3>별 문자 출력하기</h3>
    <hr>
    <script>
        let input = prompt("정수를 입력하세요", "");
        printStar(input);
    </script>
</body>
</html>
